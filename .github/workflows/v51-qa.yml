name: V5.1 catalog correction QA
on:
  pull_request:
    branches: [main]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run qa:shopify
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/v51.spec.ts
