name: V4.3 Client Content QA
on:
  push:
    branches: [v4.3-client-content-round]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Smoke
        run: npm test
      - name: Full Playwright regression + V4.3 QA
        run: npm run qa
      - name: Upload V4.3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-3-client-content-screenshots
          path: |
            qa-v43/
            qa-screenshots/
          if-no-files-found: warn
