name: V4.7 QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Full QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Smoke
        run: npm test

      - name: Shopify QA
        run: npm run qa:shopify

      - name: SEO QA
        run: npm run qa:seo

      - name: Playwright
        run: npm run qa

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v47-qa-evidence
          if-no-files-found: ignore
          retention-days: 3
          path: |
            qa-screenshots/**
            test-results/**
